<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="600" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">EPMS - Entity Relationship Diagram</text>
  <text x="450" y="55" text-anchor="middle" fill="#64748b" font-size="12">SmartPark | Rubavu District, Rwanda</text>

  <!-- ======= DEPARTMENT ENTITY ======= -->
  <rect x="30" y="80" width="220" height="210" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Header -->
  <rect x="30" y="80" width="220" height="35" rx="8" fill="#0ea5e9"/>
  <rect x="30" y="100" width="220" height="15" fill="#0ea5e9"/>
  <text x="140" y="102" text-anchor="middle" fill="white" font-size="13" font-weight="bold">DEPARTMENT</text>
  <!-- PK -->
  <text x="45" y="130" fill="#fbbf24" font-size="11" font-weight="bold">PK</text>
  <text x="75" y="130" fill="#e2e8f0" font-size="11">DepartmentCode (VARCHAR)</text>
  <line x1="30" y1="137" x2="250" y2="137" stroke="#334155" stroke-width="1"/>
  <text x="45" y="153" fill="#94a3b8" font-size="11">DepartmentName (VARCHAR)</text>
  <line x1="30" y1="160" x2="250" y2="160" stroke="#334155" stroke-width="1"/>
  <text x="45" y="176" fill="#94a3b8" font-size="11">GrossSalary (DECIMAL)</text>
  <!-- Relationship label -->
  <text x="140" y="270" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">one department</text>
  <text x="140" y="282" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">has many employees</text>

  <!-- ======= EMPLOYEE ENTITY ======= -->
  <rect x="330" y="80" width="240" height="290" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="330" y="80" width="240" height="35" rx="8" fill="#0ea5e9"/>
  <rect x="330" y="100" width="240" height="15" fill="#0ea5e9"/>
  <text x="450" y="102" text-anchor="middle" fill="white" font-size="13" font-weight="bold">EMPLOYEE</text>
  <text x="345" y="130" fill="#fbbf24" font-size="11" font-weight="bold">PK</text>
  <text x="375" y="130" fill="#e2e8f0" font-size="11">EmployeeNumber (INT AI)</text>
  <line x1="330" y1="137" x2="570" y2="137" stroke="#334155" stroke-width="1"/>
  <text x="345" y="153" fill="#94a3b8" font-size="11">FirstName (VARCHAR)</text>
  <line x1="330" y1="160" x2="570" y2="160" stroke="#334155" stroke-width="1"/>
  <text x="345" y="176" fill="#94a3b8" font-size="11">LastName (VARCHAR)</text>
  <line x1="330" y1="183" x2="570" y2="183" stroke="#334155" stroke-width="1"/>
  <text x="345" y="199" fill="#94a3b8" font-size="11">Position (VARCHAR)</text>
  <line x1="330" y1="206" x2="570" y2="206" stroke="#334155" stroke-width="1"/>
  <text x="345" y="222" fill="#94a3b8" font-size="11">Address (VARCHAR)</text>
  <line x1="330" y1="229" x2="570" y2="229" stroke="#334155" stroke-width="1"/>
  <text x="345" y="245" fill="#94a3b8" font-size="11">Telephone (VARCHAR)</text>
  <line x1="330" y1="252" x2="570" y2="252" stroke="#334155" stroke-width="1"/>
  <text x="345" y="268" fill="#94a3b8" font-size="11">Gender (ENUM)</text>
  <line x1="330" y1="275" x2="570" y2="275" stroke="#334155" stroke-width="1"/>
  <text x="345" y="291" fill="#94a3b8" font-size="11">HiredDate (DATE)</text>
  <line x1="330" y1="298" x2="570" y2="298" stroke="#334155" stroke-width="1"/>
  <text x="345" y="314" fill="#f97316" font-size="11" font-weight="bold">FK</text>
  <text x="375" y="314" fill="#fda4af" font-size="11">DepartmentCode</text>
  <!-- Relationship label -->
  <text x="450" y="390" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">one employee</text>
  <text x="450" y="402" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">has many salaries</text>

  <!-- ======= SALARY ENTITY ======= -->
  <rect x="650" y="80" width="220" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="650" y="80" width="220" height="35" rx="8" fill="#0ea5e9"/>
  <rect x="650" y="100" width="220" height="15" fill="#0ea5e9"/>
  <text x="760" y="102" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SALARY</text>
  <text x="665" y="130" fill="#fbbf24" font-size="11" font-weight="bold">PK</text>
  <text x="695" y="130" fill="#e2e8f0" font-size="11">SalaryID (INT AI)</text>
  <line x1="650" y1="137" x2="870" y2="137" stroke="#334155" stroke-width="1"/>
  <text x="665" y="153" fill="#f97316" font-size="11" font-weight="bold">FK</text>
  <text x="695" y="153" fill="#fda4af" font-size="11">EmployeeNumber</text>
  <line x1="650" y1="160" x2="870" y2="160" stroke="#334155" stroke-width="1"/>
  <text x="665" y="176" fill="#94a3b8" font-size="11">GrossSalary (DECIMAL)</text>
  <line x1="650" y1="183" x2="870" y2="183" stroke="#334155" stroke-width="1"/>
  <text x="665" y="199" fill="#94a3b8" font-size="11">TotalDeduction (DECIMAL)</text>
  <line x1="650" y1="206" x2="870" y2="206" stroke="#334155" stroke-width="1"/>
  <text x="665" y="222" fill="#22c55e" font-size="11">NetSalary (COMPUTED)</text>
  <line x1="650" y1="229" x2="870" y2="229" stroke="#334155" stroke-width="1"/>
  <text x="665" y="245" fill="#94a3b8" font-size="11">Month (VARCHAR)</text>

  <!-- ======= RELATIONSHIPS ======= -->
  <!-- Dept to Employee: 1 to Many -->
  <!-- Line from right of Dept to left of Employee -->
  <line x1="250" y1="175" x2="330" y2="175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Crow's foot (many) on Employee side -->
  <line x1="325" y1="168" x2="330" y2="175" stroke="#38bdf8" stroke-width="2"/>
  <line x1="325" y1="182" x2="330" y2="175" stroke="#38bdf8" stroke-width="2"/>
  <line x1="320" y1="175" x2="330" y2="175" stroke="#38bdf8" stroke-width="2"/>
  <!-- One on Dept side -->
  <line x1="250" y1="169" x2="250" y2="181" stroke="#38bdf8" stroke-width="2"/>
  <line x1="255" y1="169" x2="255" y2="181" stroke="#38bdf8" stroke-width="2"/>
  <!-- Label -->
  <rect x="263" y="160" width="55" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="290" y="173" text-anchor="middle" fill="#38bdf8" font-size="10">1 : N</text>

  <!-- Employee to Salary: 1 to Many -->
  <line x1="570" y1="175" x2="650" y2="175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Crow's foot (many) on Salary side -->
  <line x1="645" y1="168" x2="650" y2="175" stroke="#38bdf8" stroke-width="2"/>
  <line x1="645" y1="182" x2="650" y2="175" stroke="#38bdf8" stroke-width="2"/>
  <line x1="640" y1="175" x2="650" y2="175" stroke="#38bdf8" stroke-width="2"/>
  <!-- One on Employee side -->
  <line x1="570" y1="169" x2="570" y2="181" stroke="#38bdf8" stroke-width="2"/>
  <line x1="575" y1="169" x2="575" y2="181" stroke="#38bdf8" stroke-width="2"/>
  <!-- Label -->
  <rect x="583" y="160" width="55" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="173" text-anchor="middle" fill="#38bdf8" font-size="10">1 : N</text>

  <!-- USERS ENTITY -->
  <rect x="330" y="430" width="240" height="140" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <rect x="330" y="430" width="240" height="35" rx="8" fill="#7c3aed"/>
  <rect x="330" y="450" width="240" height="15" fill="#7c3aed"/>
  <text x="450" y="452" text-anchor="middle" fill="white" font-size="13" font-weight="bold">USERS (Auth)</text>
  <text x="345" y="480" fill="#fbbf24" font-size="11" font-weight="bold">PK</text>
  <text x="375" y="480" fill="#e2e8f0" font-size="11">UserID (INT AI)</text>
  <line x1="330" y1="487" x2="570" y2="487" stroke="#334155" stroke-width="1"/>
  <text x="345" y="503" fill="#94a3b8" font-size="11">Username (VARCHAR UNIQUE)</text>
  <line x1="330" y1="510" x2="570" y2="510" stroke="#334155" stroke-width="1"/>
  <text x="345" y="526" fill="#94a3b8" font-size="11">Password (VARCHAR bcrypt)</text>
  <line x1="330" y1="533" x2="570" y2="533" stroke="#334155" stroke-width="1"/>
  <text x="345" y="549" fill="#94a3b8" font-size="11">CreatedAt (TIMESTAMP)</text>
  <text x="450" y="575" text-anchor="middle" fill="#7c3aed" font-size="10" font-style="italic">Used for session-based login only</text>

  <!-- Legend -->
  <rect x="30" y="430" width="250" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="155" y="452" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">LEGEND</text>
  <rect x="45" y="460" width="10" height="10" fill="#fbbf24"/>
  <text x="62" y="470" fill="#e2e8f0" font-size="11">PK - Primary Key</text>
  <rect x="45" y="478" width="10" height="10" fill="#f97316"/>
  <text x="62" y="488" fill="#e2e8f0" font-size="11">FK - Foreign Key</text>
  <rect x="45" y="496" width="10" height="10" fill="#22c55e"/>
  <text x="62" y="506" fill="#e2e8f0" font-size="11">Computed Column</text>
  <line x1="45" y1="520" x2="75" y2="520" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="82" y="524" fill="#e2e8f0" font-size="11">Relationship</text>
  <line x1="45" y1="540" x2="55" y2="540" stroke="#38bdf8" stroke-width="2"/>
  <line x1="52" y1="534" x2="57" y2="540" stroke="#38bdf8" stroke-width="2"/>
  <line x1="52" y1="546" x2="57" y2="540" stroke="#38bdf8" stroke-width="2"/>
  <text x="62" y="544" fill="#e2e8f0" font-size="11">Many (crow's foot)</text>
  <line x1="200" y1="534" x2="200" y2="546" stroke="#38bdf8" stroke-width="2"/>
  <line x1="205" y1="534" x2="205" y2="546" stroke="#38bdf8" stroke-width="2"/>
  <text x="213" y="544" fill="#e2e8f0" font-size="11">One</text>
  <text x="155" y="565" text-anchor="middle" fill="#64748b" font-size="9">Nisingizwe Rukundo | EPMS 2025</text>
</svg>
